[project]
name = "taiga-cli"
dynamic = ["version"]
description = "Token-efficient command-line client for Taiga, designed for AI agents."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "K-Tech s.r.l." }]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
]

[project.scripts]
taiga-cli = "taiga_cli.cli:main"

[dependency-groups]
bench = [
    "anthropic>=2.14.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "tox>=4.22",
    "tox-uv>=1.13",
]
docs = [
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/taiga_cli"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.1"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits a real Taiga instance (opt-in, run with `-m live`)",
]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["taiga_cli"]

# --- tox --------------------------------------------------------------------
[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.13"]
env_list = ["lint", "3.11", "3.12", "3.13", "3.14", "docs"]

[tool.tox.env_run_base]
description = "run tests on {env_name}"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pytest", "-m", "not live", { replace = "posargs", extend = true }]]

[tool.tox.env.lint]
description = "ruff lint + format check"
skip_install = true
dependency_groups = ["dev"]
commands = [["ruff", "check", "."], ["ruff", "format", "--check", "."]]

[tool.tox.env.docs]
description = "build the documentation site"
skip_install = true
dependency_groups = ["docs"]
commands = [["zensical", "build", "--clean", "--strict"]]
