[project]
site_name = "taiga-cli"
site_description = "Token-efficient Taiga command-line client for AI agents"
# site_url = "https://<owner>.github.io/<repo>/"   # set once the GitHub repo exists
# repo_url = "https://github.com/<owner>/<repo>"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "user/index.md",
    { "Installation" = "user/installation.md" },
    { "Authentication" = "user/authentication.md" },
    { "Commands" = "user/commands.md" },
    { "Project config file" = "user/project-config.md" },
    { "Output & exit codes" = "user/output.md" },
    { "Using with AI agents" = "user/agents.md" },
  ] },
  { "Developer guide" = [
    "dev/index.md",
    { "Setup" = "dev/setup.md" },
    { "Architecture" = "dev/architecture.md" },
    { "Testing" = "dev/testing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
